# ─── GridMind — Docker Compose ───────────────────────────────────────────────
# Starts all GridMind services in one command: docker compose up -d
#
# Services:
#   db        → PostgreSQL 16 database
#   backend   → FastAPI ML API (port 8000)
#   frontend  → Next.js dashboard (port 3000)
#
# Usage:
#   docker compose up -d          → Start everything in background
#   docker compose logs -f        → Watch all logs
#   docker compose down           → Stop and remove containers
#   docker compose down -v        → Stop + delete database volume too

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gridmind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridmind}
      POSTGRES_USER: ${POSTGRES_USER:-gridmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridmind_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridmind_user} -d ${POSTGRES_DB:-gridmind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridmind-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database (points to the 'db' service above)
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gridmind}
      POSTGRES_USER: ${POSTGRES_USER:-gridmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridmind_pass}
      # JWT — CHANGE THIS in production!
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_secret_in_production}
      JWT_ALGORITHM: HS256
      # CORS — allow Next.js frontend
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
      # Redis (optional — Celery tasks)
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
    ports:
      - "8000:8000"
    volumes:
      # Persist trained model files and dataset across restarts
      - ./backend/ml_models:/app/ml_models
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: gridmind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

# ─── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
