services:
  - type: web
    name: gridmind-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "https://gridmind-beta.vercel.app,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
